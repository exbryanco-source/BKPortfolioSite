<!doctype html>
<!-- Social share card (1200×630), captured to public/og-image.png by scripts/make-brand-assets.mjs.
     Footer-style lockup (logo + wordmark) over the hero statement. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face { font-family: 'Inter'; font-weight: 400; src: url(../node_modules/@fontsource/inter/files/inter-latin-400-normal.woff2) format('woff2'); }
      @font-face { font-family: 'Inter'; font-weight: 700; src: url(../node_modules/@fontsource/inter/files/inter-latin-700-normal.woff2) format('woff2'); }
      * { box-sizing: border-box; margin: 0; }
      html, body { width: 1200px; height: 630px; }
      body {
        display: flex; flex-direction: column; justify-content: space-between;
        padding: 72px 80px; background: #fcfcf8; color: #11120f; font-family: 'Inter', sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .brand { display: flex; align-items: center; gap: 24px; }
      .brand img { width: 150px; height: 96px; }
      .brand span { font-weight: 700; font-size: 96px; line-height: 96px; letter-spacing: -1px; }
      h1 { font-weight: 400; font-size: 56px; line-height: 1.12; max-width: 960px; }
      .meta { display: flex; justify-content: space-between; align-items: center; font-size: 24px; color: #686a62; border-top: 1px solid #c9c9c0; padding-top: 24px; }
    </style>
  </head>
  <body>
    <div class="brand"><img src="../public/assets/footer-logo.svg" alt="" /><span>Superpills</span></div>
    <h1>A Creative Director at the intersection of Brand &amp; Product.</h1>
    <div class="meta"><span>Bryan Khua — Brand, Product &amp; Motion</span><span>bryankhua.com</span></div>
  </body>
</html>
